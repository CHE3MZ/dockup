name: full-test
on:
  push:
  workflow_dispatch:
jobs:
  full:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build
        run: go build -o dockup.exe ./cmd/dockup
      - name: help for every command
        run: |
          .\dockup.exe --help
          .\dockup.exe -h
          .\dockup.exe help
          .\dockup.exe help setup
          .\dockup.exe setup --help
          .\dockup.exe setup -h
          .\dockup.exe uninstall --help
          .\dockup.exe ps --help
          .\dockup.exe daemon --help
          .\dockup.exe shutdown --help
          .\dockup.exe doctor --help
          .\dockup.exe version
      - name: dry run changes nothing
        run: |
          echo y | .\dockup.exe setup --dry-run
          $list = wsl --list --quiet
          if ($list -match 'dockup') { throw 'dry-run created a distro' }
      - name: config file created with bare minimum
        run: |
          .\dockup.exe version
          $p = "$env:USERPROFILE\.dockup\config.json"
          if (!(Test-Path $p)) { throw 'config.json not created' }
          $c = Get-Content $p -Raw | ConvertFrom-Json
          if (!$c.default_path) { throw 'default_path missing' }
          if ($c.port -ne 2375) { throw "port = $($c.port)" }
          if ($c.use_tcp -ne $false) { throw 'use_tcp should default false' }
          if (!$c.pipe_name) { throw 'pipe_name missing' }
      - name: setup with custom path
        run: echo y | .\dockup.exe setup --amd --path="C:\dockup-fulltest-wsl"
      - name: config paths follow custom install
        run: |
          $c = Get-Content "$env:USERPROFILE\.dockup\config.json" -Raw | ConvertFrom-Json
          if ($c.default_path -ne 'C:/dockup-fulltest-wsl') { throw "default_path = $($c.default_path)" }
          if ($c.current_path -ne 'C:/dockup-fulltest-wsl') { throw "current_path = $($c.current_path)" }
      - name: diagnose setup failure
        if: failure()
        continue-on-error: true
        run: |
          Get-Item $env:TEMP\dockup-* -ErrorAction Continue | Select-Object FullName, Length
          wsl --list --verbose
          Get-ChildItem C:\dockup-fulltest-wsl -Recurse -ErrorAction Continue | Select-Object FullName, Length
      - name: doctor after setup
        run: .\dockup.exe doctor
      - name: daemon start
        run: .\dockup.exe daemon start
      - name: daemon status
        run: .\dockup.exe daemon status
      - name: daemon log follows and exits on kill
        run: |
          $tail = "logtail.txt"
          if (Test-Path $tail) { Remove-Item $tail }
          $p = Start-Process .\dockup.exe -ArgumentList 'daemon','log' -RedirectStandardOutput $tail -WindowStyle Hidden -PassThru
          Start-Sleep 5
          if ($p.HasExited) { throw 'daemon log exited early' }
          Stop-Process -Id $p.Id -Force
          Start-Sleep 1
          $t = Get-Content $tail -Raw
          if ($t -notmatch 'read-only') { throw "unexpected log tail: $t" }
          Remove-Item $tail
          exit 0
      - name: ps shows starting while engine is down
        run: |
          wsl -d dockup -u root -- systemctl stop docker.service docker.socket
          Start-Sleep 3
          $ps = (.\dockup.exe ps) -join "`n"
          if ($ps -notmatch 'starting\.\.\.') { throw "expected starting..., got: $ps" }
          wsl -d dockup -u root -- systemctl start docker.service
          $back = $false
          for ($i = 0; $i -lt 30; $i++) {
            $ps = (.\dockup.exe ps) -join "`n"
            if ($ps -match 'running') { $back = $true; break }
            Start-Sleep 2
          }
          if (!$back) { throw "engine did not come back: $ps" }
          exit 0
      - name: autostart defaults off
        run: |
          $o = .\dockup.exe daemon autostart
          if ($o -notmatch 'autostart: off') { throw "query = $o" }
          $ps = (.\dockup.exe ps) -join "`n"
          foreach ($want in @('STATUS', 'AUTOSTART', 'off')) {
            if ($ps -notmatch $want) { throw "ps missing ${want}: $ps" }
          }
      - name: autostart on persists to config and Startup entry
        run: |
          .\dockup.exe daemon autostart on
          $c = Get-Content "$env:USERPROFILE\.dockup\config.json" -Raw | ConvertFrom-Json
          if ($c.autostart -ne $true) { throw 'autostart not saved' }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\dockup.lnk"
          if (!(Test-Path $lnk)) { throw 'startup entry missing' }
          $ps = (.\dockup.exe ps) -join "`n"
          if ($ps -notmatch 'AUTOSTART') { throw "ps missing AUTOSTART column: $ps" }
          if ($ps -notmatch '\bon\b') { throw "ps missing on: $ps" }
          .\dockup.exe doctor | Select-String -Pattern 'autostart on' | Out-Null
      - name: autostart off removes Startup entry
        run: |
          .\dockup.exe daemon autostart off
          $c = Get-Content "$env:USERPROFILE\.dockup\config.json" -Raw | ConvertFrom-Json
          if ($c.autostart -ne $false) { throw 'autostart not cleared' }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\dockup.lnk"
          if (Test-Path $lnk) { throw 'startup entry still present' }
          $ps = (.\dockup.exe ps) -join "`n"
          if ($ps -notmatch '\boff\b') { throw "ps missing off: $ps" }
      - name: docker version via pipe
        run: |
          $H = 'npipe:////./pipe/dockup_engine'
          docker -H $H version
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'WARNING: first version attempt failed, dumping forensics and retrying once'
            Get-Content "$env:APPDATA\dockup\logs\dockup.log" -Tail 20 -ErrorAction Continue
            wsl -d dockup -u root -- systemctl status docker.service --no-pager
            wsl -d dockup -u root -- journalctl -u docker.service --no-pager -n 30
            wsl -d dockup -u root -- docker version --format '{{.Server.Version}}'
            docker -H $H version
            if ($LASTEXITCODE -ne 0) { throw 'version via pipe failed twice' }
          }
          exit 0
      - name: hello-world via pipe
        timeout-minutes: 5
        run: docker -H npipe:////./pipe/dockup_engine run --rm hello-world
      - name: compose via pipe
        timeout-minutes: 5
        run: |
          $env:DOCKER_HOST = 'npipe:////./pipe/dockup_engine'
          docker compose version
          @('services:', '  hello:', '    image: hello-world') | Set-Content compose.yaml
          docker compose -f compose.yaml up --abort-on-container-exit
          docker compose -f compose.yaml down
          Remove-Item compose.yaml
      - name: stdin and tty through the bridge
        timeout-minutes: 5
        run: |
          $H = 'npipe:////./pipe/dockup_engine'
          $o = echo hello | docker -H $H run --rm -i busybox sh -c 'read line; echo got:$line'
          if (($o -join "`n") -notmatch 'got:hello') { throw "stdin bridge failed: $o" }
          $t = docker -H $H run --rm -t busybox echo tty-ok
          if (($t -join "`n") -notmatch 'tty-ok') { throw "tty bridge failed: $t" }
          exit 0
      - name: exec and logs -f through the bridge
        timeout-minutes: 5
        run: |
          $H = 'npipe:////./pipe/dockup_engine'
          docker -H $H run -d --name dockup-e2e-sleeper busybox sleep 60
          $e = docker -H $H exec dockup-e2e-sleeper echo exec-ok
          if (($e -join "`n") -notmatch 'exec-ok') { throw "exec failed: $e" }
          $i = echo exec-stdin | docker -H $H exec -i dockup-e2e-sleeper sh -c 'read line; echo got:$line'
          if (($i -join "`n") -notmatch 'got:exec-stdin') { throw "exec stdin failed: $i" }
          docker -H $H run -d --name dockup-e2e-logger busybox sh -c 'echo line1; sleep 2; echo line2'
          $lg = (docker -H $H logs -f dockup-e2e-logger) -join "`n"
          docker -H $H rm -f dockup-e2e-sleeper dockup-e2e-logger | Out-Null
          if ($lg -notmatch 'line1[\s\S]*line2') { throw "logs -f failed: $lg" }
          exit 0
      - name: piped-stdin EOF to cat (definitive)
        timeout-minutes: 5
        run: |
          $H = 'npipe:////./pipe/dockup_engine'
          $cname = "dockup-e2e-catmain-$env:GITHUB_RUN_ID"
          $o = echo probe-eof | docker -H $H run -i --name $cname busybox sh -c 'cat; echo MARKER'
          docker -H $H rm -f $cname | Out-Null
          if (($o -join "`n") -notmatch 'probe-eof[\s\S]*MARKER') { throw "stdin EOF broken: [$o]" }
          exit 0
      - name: autostart entry boots daemon after stop (login simulation)
        run: |
          .\dockup.exe daemon autostart on
          .\dockup.exe daemon stop
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\dockup.lnk"
          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut($lnk)
          Start-Process -FilePath $sc.TargetPath -ArgumentList $sc.Arguments -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 30; $i++) {
            .\dockup.exe daemon status | Out-Null
            if ($LASTEXITCODE -eq 0) { $up = $true; break }
            Start-Sleep 2
          }
          if (!$up) { throw 'daemon did not come up via startup entry' }
          .\dockup.exe daemon autostart off
      - name: enable TCP on custom port
        run: |
          $p = "$env:USERPROFILE\.dockup\config.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.use_tcp = $true
          $c.port = 2376
          $c | ConvertTo-Json | Set-Content $p
          .\dockup.exe daemon restart
          .\dockup.exe doctor
      - name: docker version via custom TCP port
        run: docker -H tcp://127.0.0.1:2376 version
      - name: hello-world via custom TCP port
        timeout-minutes: 5
        run: docker -H tcp://127.0.0.1:2376 run --rm hello-world
      - name: disable TCP again
        run: |
          $p = "$env:USERPROFILE\.dockup\config.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.use_tcp = $false
          $c.port = 2375
          $c | ConvertTo-Json | Set-Content $p
          .\dockup.exe daemon restart
          .\dockup.exe daemon status
      - name: upgrade engine to latest
        timeout-minutes: 10
        run: |
          .\dockup.exe upgrade
          docker -H npipe:////./pipe/dockup_engine version
      - name: daemon stop
        run: .\dockup.exe daemon stop
      - name: foreground run serves the bridge
        run: |
          $p = Start-Process .\dockup.exe -WindowStyle Hidden -PassThru
          try {
            $up = $false
            $ps = ''
            for ($i = 0; $i -lt 30; $i++) {
              $ps = (.\dockup.exe ps) -join "`n"
              if ($ps -match 'running') { $up = $true; break }
              Start-Sleep 2
            }
            if (!$up) { throw "foreground did not come up: $ps" }
            docker -H npipe:////./pipe/dockup_engine version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'version via foreground failed' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction Continue
          }
          $down = $false
          for ($i = 0; $i -lt 15; $i++) {
            $ps = (.\dockup.exe ps) -join "`n"
            if ($ps -match 'stopped') { $down = $true; break }
            Start-Sleep 1
          }
          if (!$down) { throw "foreground did not release the pipe: $ps" }
          exit 0
      - name: shutdown
        run: .\dockup.exe shutdown
      - name: uninstall keeps default path
        run: |
          echo y | .\dockup.exe uninstall
          $list = wsl --list --quiet
          if ($list -match 'dockup') { throw 'distro still present after uninstall' }
          $c = Get-Content "$env:USERPROFILE\.dockup\config.json" -Raw | ConvertFrom-Json
          if ($c.current_path) { throw "current_path not cleared: $($c.current_path)" }
          if ($c.default_path -ne 'C:/dockup-fulltest-wsl') { throw "default_path not retained: $($c.default_path)" }

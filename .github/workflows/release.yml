name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v1.1.0)
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: verify tag
        id: tag
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          actual="$(git describe --tags --exact-match)"
          test "$actual" = "$EXPECTED_TAG"
          prev="$(git describe --tags --abbrev=0 "${EXPECTED_TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            echo "range=${prev}..${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: ${{ steps.tag.outputs.range }} --strip all --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ inputs.dry_run && 'release --snapshot --clean' || 'release --clean' }} --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload dry-run artifacts
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/*
          if-no-files-found: error
          retention-days: 7

name: e2e-wsl
on:
  push:
  workflow_dispatch:
    inputs:
      full-setup:
        description: 'Run full dockup setup (downloads ~250MB + installs docker in WSL)'
        required: false
        default: 'false'
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: wsl version
        run: wsl --version
      - name: wsl list
        run: wsl --list --quiet
      - name: build
        run: go build -ldflags "-X github.com/CHE3MZ/dockup/internal/config.Version=$(git rev-parse --short HEAD)" -o dockup.exe ./cmd/dockup
      - name: version
        run: .\dockup.exe version
      - name: doctor (no setup yet)
        run: .\dockup.exe doctor
      - name: ps (expect stopped)
        run: .\dockup.exe ps
      - name: daemon start refused when nothing installed
        run: |
          .\dockup.exe daemon autostart on
          $o = .\dockup.exe daemon start 2>&1
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          if (($o -join "`n") -notmatch 'autostart skipped') { throw "wrong refusal: $o" }
          .\dockup.exe daemon autostart off
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\dockup.lnk"
          if (Test-Path $lnk) { throw 'startup entry left behind' }
          exit 0
      - name: ps reports foreign pipe holder
        run: |
          $job = Start-Job {
            $srv = [System.IO.Pipes.NamedPipeServerStream]::new('dockup_engine', [System.IO.Pipes.PipeDirection]::InOut, 1, [System.IO.Pipes.PipeTransmissionMode]::Byte, [System.IO.Pipes.PipeOptions]::Asynchronous)
            $t = $srv.WaitForConnectionAsync()
            Start-Sleep 30
          }
          $ps = ''
          for ($i = 0; $i -lt 5 -and $ps -notmatch 'another program'; $i++) {
            $ps = (.\dockup.exe ps) -join "`n"
            Start-Sleep 2
          }
          Stop-Job $job -ErrorAction Continue | Out-Null
          Remove-Job $job -Force -ErrorAction Continue
          if ($ps -notmatch 'another program') { throw "expected foreign hint: [$ps]" }
          exit 0
      - name: daemon restart without setup exits 1
        run: |
          .\dockup.exe daemon restart
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          exit 0
      - name: daemon status exits 1 when stopped
        run: |
          .\dockup.exe daemon status
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          exit 0
      - name: setup rejects double arch flags with exit 1
        run: |
          .\dockup.exe setup --amd --arm
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          exit 0
  full-setup:
    if: github.event.inputs.full-setup == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build
        run: go build -ldflags "-X github.com/CHE3MZ/dockup/internal/config.Version=$(git rev-parse --short HEAD)" -o dockup.exe ./cmd/dockup
      - name: setup dockup (amd64)
        run: echo y | .\dockup.exe setup --amd
      - name: diagnose import failure
        if: failure()
        run: |
          Get-Item $env:TEMP\dockup-* -ErrorAction Continue | Select-Object FullName, Length
          wsl --list --verbose
          Get-ChildItem $env:LOCALAPPDATA\dockup -Recurse -ErrorAction Continue | Select-Object FullName, Length
      - name: doctor after setup
        run: .\dockup.exe doctor
      - name: daemon start
        run: .\dockup.exe daemon start
      - name: daemon status
        run: .\dockup.exe daemon status
      - name: docker version via pipe
        run: docker -H npipe:////./pipe/dockup_engine version
      - name: hello-world via pipe
        timeout-minutes: 5
        run: docker -H npipe:////./pipe/dockup_engine run --rm hello-world
      - name: daemon stop
        run: .\dockup.exe daemon stop
      - name: shutdown
        run: .\dockup.exe shutdown

name: e2e-wsl
# Full end-to-end on a GitHub-hosted Windows 2025 runner (has WSL2 +
# nested virtualization; windows-2022 runners do NOT reliably support WSL2).
# Heavy steps (apt docker-ce install, docker pull) run on GitHub's network.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-wsl
  cancel-in-progress: false

jobs:
  e2e-debian:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet + unit tests
        run: |
          go vet ./...
          go test ./...

      - name: Build dockup.exe
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -o dockup.exe ./cmd/dockup
          .\dockup.exe version

      - name: Prepare WSL2
        run: |
          wsl --set-default-version 2
          # wsl --update is occasionally flaky (403 from MS servers); retry.
          for ($i = 1; $i -le 5; $i++) {
            wsl --update
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "wsl --update attempt $i failed, retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          wsl --status
          wsl --version

      - name: Install Debian distro
        run: |
          wsl --install -d Debian --no-launch
          wsl --list --verbose
          # First launch initializes the distro; wait until it answers.
          for ($i = 1; $i -le 20; $i++) {
            wsl -d Debian -- echo hello 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "waiting for Debian... ($i/20)"
            Start-Sleep -Seconds 15
          }
          wsl -d Debian -- echo hello
          wsl --list --verbose

      - name: Install Windows docker CLI (no engine, client only)
        run: |
          choco install docker-cli -y --no-progress
          docker --version
          docker compose version

      - name: dockup doctor (pre-setup)
        run: .\dockup.exe doctor

      - name: dockup setup Debian
        run: |
          .\dockup.exe setup Debian
          .\dockup.exe list

      - name: dockup doctor (post-setup)
        run: .\dockup.exe doctor

      - name: dockup daemon start
        run: |
          .\dockup.exe daemon start -d Debian
          Start-Sleep -Seconds 10
          .\dockup.exe daemon status -d Debian
          .\dockup.exe ps

      - name: docker run hello-world through dockup relay
        run: |
          $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'
          .\dockup.exe env --shell powershell
          docker version
          docker run --rm hello-world

      - name: docker compose plugin check
        run: |
          $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'
          docker compose version

      - name: Double-start guard (must attach/report, not duplicate)
        run: |
          .\dockup.exe daemon status -d Debian

      - name: dockup shutdown (must leave distro running-state safe + ps stopped)
        run: |
          .\dockup.exe shutdown
          .\dockup.exe ps
          .\dockup.exe cleanup
          .\dockup.exe doctor

      - name: Upload dockup state + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockup-state-logs
          path: |
            ${{ env.APPDATA }}\dockup\state.json
            ${{ env.APPDATA }}\dockup\logs\*.log
          if-no-files-found: warn

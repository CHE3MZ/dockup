name: e2e-wsl
on:
  push:
  workflow_dispatch:
    inputs:
      full-setup:
        description: 'Run full dockup setup (downloads ~250MB + installs docker in WSL)'
        required: false
        default: 'false'
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: wsl version
        run: wsl --version
      - name: wsl list
        run: wsl --list --quiet
      - name: build
        run: go build -o dockup.exe ./cmd/dockup
      - name: version
        run: .\dockup.exe version
      - name: doctor (no setup yet)
        run: .\dockup.exe doctor
      - name: ps (expect stopped)
        run: .\dockup.exe ps
      - name: daemon status exits 1 when stopped
        run: |
          .\dockup.exe daemon status
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          exit 0
      - name: setup rejects double arch flags with exit 1
        run: |
          .\dockup.exe setup --amd --arm
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          exit 0
  full-setup:
    if: github.event.inputs.full-setup == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build
        run: go build -o dockup.exe ./cmd/dockup
      - name: setup dockup (amd64)
        run: echo y | .\dockup.exe setup --amd
      - name: diagnose import failure
        if: failure()
        run: |
          Get-Item $env:TEMP\dockup-* -ErrorAction Continue | Select-Object FullName, Length
          wsl --list --verbose
          Get-ChildItem $env:LOCALAPPDATA\dockup -Recurse -ErrorAction Continue | Select-Object FullName, Length
      - name: doctor after setup
        run: .\dockup.exe doctor
      - name: daemon start
        run: .\dockup.exe daemon start
      - name: daemon status
        run: .\dockup.exe daemon status
      - name: docker version via pipe
        run: docker -H npipe:////./pipe/dockup_engine version
      - name: hello-world via pipe
        timeout-minutes: 5
        run: docker -H npipe:////./pipe/dockup_engine run --rm hello-world
      - name: daemon stop
        run: .\dockup.exe daemon stop
      - name: shutdown
        run: .\dockup.exe shutdown

name: e2e-wsl
# Full end-to-end on a GitHub-hosted Windows 2025 runner (has WSL2 +
# nested virtualization; windows-2022 runners do NOT reliably support WSL2).
# Heavy steps (apt docker-ce install, docker pull) run on GitHub's network.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-wsl
  cancel-in-progress: false

jobs:
  e2e-debian:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet + unit tests
        run: |
          go vet ./...
          go test ./...

      - name: Build dockup.exe
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $sha = git rev-parse --short HEAD
          go build -ldflags "-X main.version=v0.1.0-dev -X main.commit=$sha" -o dockup.exe ./cmd/dockup
          .\dockup.exe version

      - name: Prepare WSL2
        run: |
          wsl --set-default-version 2
          # wsl --update is occasionally flaky (403 from MS servers); retry.
          for ($i = 1; $i -le 5; $i++) {
            wsl --update
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "wsl --update attempt $i failed, retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          wsl --status
          wsl --version

      - name: Install Debian distro
        run: |
          wsl --install -d Debian --no-launch
          wsl --list --verbose
          # First launch initializes the distro; wait until it answers.
          for ($i = 1; $i -le 20; $i++) {
            wsl -d Debian -- echo hello 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "waiting for Debian... ($i/20)"
            Start-Sleep -Seconds 15
          }
          wsl -d Debian -- echo hello
          wsl --list --verbose

      - name: Install Windows docker CLI (no engine, client only)
        run: |
          choco install docker-cli -y --no-progress
          docker --version
          docker compose version

      # The image ships its own daemon (service `docker`, dockerd.exe) on the
      # DEFAULT pipe name, which would silently answer our relay tests
      # (false pass). Disable/stop/kill it in a verify loop (the service may
      # still be starting when we arrive), then gate on EXIT CODES only:
      # `if (docker version ...)` is output-truthy and always true.
      - name: Decontaminate default pipe
        run: |
          Write-Host '--- pipes before ---'
          [System.IO.Directory]::GetFiles('\\.\pipe\') | Select-String 'docker|containerd'
          Write-Host '--- docker-ish services ---'
          Get-Service | Where-Object { $_.Name -like '*docker*' -or $_.Name -like '*contain*' } | Format-Table Name, Status, StartType
          Write-Host '--- docker-ish processes ---'
          Get-Process | Where-Object { $_.ProcessName -like '*docker*' -or $_.ProcessName -like '*containerd*' } | Format-Table ProcessName, Id
          for ($i = 1; $i -le 12; $i++) {
            Get-Service | Where-Object { $_.Name -like '*docker*' -or $_.Name -like '*contain*' } | Set-Service -StartupType Disabled -ErrorAction SilentlyContinue
            Get-Service | Where-Object { $_.Name -like '*docker*' -or $_.Name -like '*contain*' } | Stop-Service -Force -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -eq 'dockerd' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
            $pipeGone = -not (Test-Path '\\.\pipe\docker_engine')
            docker version >$null 2>$null
            $cliDead = $LASTEXITCODE -ne 0
            if ($pipeGone -and $cliDead) { break }
            Write-Host "decontaminate retry $i/12 (pipeGone=$pipeGone cliDead=$cliDead)..."
          }
          if (Test-Path '\\.\pipe\docker_engine') { throw 'pipe still held after decontamination' }
          docker version >$null 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'contaminated runner: a Docker daemon answers without dockup' }
          Write-Host 'pipe clean: no default daemon answering'
          exit 0

      - name: dockup doctor (pre-setup)
        run: .\dockup.exe doctor

      - name: dockup setup Debian
        timeout-minutes: 15
        run: |
          .\dockup.exe setup Debian
          if ($LASTEXITCODE -ne 0) { throw 'setup failed' }
          .\dockup.exe list

      - name: dockup doctor (post-setup)
        run: .\dockup.exe doctor

      # No-autostart proof: setup must leave binaries present but NOTHING running.
      # Forensics first (ps + unit state), asserts after.
      - name: In-distro engine check (binaries yes, autostart no)
        run: |
          wsl -d Debian -u root -- command -v dockerd
          if ($LASTEXITCODE -ne 0) { throw 'dockerd missing after setup' }
          wsl -d Debian -u root -- command -v socat
          if ($LASTEXITCODE -ne 0) { throw 'socat missing after setup' }
          Write-Host '--- forensics: processes ---'
          wsl -d Debian -u root -- ps aux | Select-String 'docker|containerd'
          Write-Host '--- forensics: unit state ---'
          wsl -d Debian -u root -- systemctl is-active docker.service docker.socket containerd.service
          wsl -d Debian -u root -- systemctl is-enabled docker.service docker.socket containerd.service
          wsl -d Debian -u root -- test -S /var/run/docker.sock
          if ($LASTEXITCODE -eq 0) { throw 'engine autostarted by setup (must stay down until dockup run)' }
          Write-Host 'binaries present, engine down: no autostart'

      - name: Foreground run serves, external shutdown tears down
        timeout-minutes: 8
        run: |
          $env:DOCKUP_DEBUG = '1'
          $proc = Start-Process -FilePath "$PWD\dockup.exe" -ArgumentList @('-d','Debian') -NoNewWindow -PassThru -RedirectStandardOutput 'fg.out.log' -RedirectStandardError 'fg.err.log'
          $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'
          $ok = $false
          $deadline = (Get-Date).AddSeconds(200)
          $i = 0
          while ((Get-Date) -lt $deadline) {
            $i++
            docker version >$null 2>$null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($proc.HasExited) { break }
            if ($i % 6 -eq 0) {
              Write-Host "--- poll $i, fg tail ---"
              Get-Content 'fg.out.log' -Tail 4 -ErrorAction SilentlyContinue
              Get-Content 'fg.err.log' -Tail 6 -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 5
          }
          Write-Host '--- foreground stdout ---'
          Get-Content 'fg.out.log' -ErrorAction SilentlyContinue
          Write-Host '--- foreground stderr ---'
          Get-Content 'fg.err.log' -ErrorAction SilentlyContinue
          Write-Host '--- in-distro post-mortem ---'
          wsl -d Debian -u root -- docker version --format '{{.Server.Version}}'
          if (-not $ok) {
            .\dockup.exe shutdown 2>$null
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'foreground relay never came up'
          }
          $hw = docker run --rm hello-world
          if ($LASTEXITCODE -ne 0) { throw 'docker run through foreground relay failed' }
          if ($hw -notmatch 'Hello from Docker!') { throw 'foreground relay failed hello-world' }
          .\dockup.exe shutdown
          if ($LASTEXITCODE -ne 0) { throw 'shutdown of foreground run failed' }
          $ps = .\dockup.exe ps
          if ($ps -notmatch 'stopped') { throw "expected stopped ps, got: $ps" }

      - name: dockup daemon start
        timeout-minutes: 8
        run: |
          .\dockup.exe daemon start -d Debian
          if ($LASTEXITCODE -ne 0) { throw 'daemon start failed' }
          Start-Sleep -Seconds 10
          $st = .\dockup.exe daemon status -d Debian
          if ($LASTEXITCODE -ne 0) { throw 'daemon status failed' }
          if ($st -notmatch 'running') { throw "expected running daemon, got: $st" }
          $ps = .\dockup.exe ps
          if ($ps -notmatch 'running') { throw "expected running ps, got: $ps" }

      - name: docker run hello-world through dockup relay
        timeout-minutes: 8
        run: |
          $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'
          .\dockup.exe env --shell powershell
          if ($LASTEXITCODE -ne 0) { throw 'dockup env failed: no relay up' }
          docker version
          $hw = docker run --rm hello-world
          if ($LASTEXITCODE -ne 0) { throw 'docker run failed' }
          if ($hw -notmatch 'Hello from Docker!') { throw 'hello-world did not run through our relay' }
          # Multi-connection exercise (each docker call = fresh STDIO bridge).
          docker run --name e2e-hw hello-world >$null
          if ($LASTEXITCODE -ne 0) { throw 'named run failed' }
          $lg = docker logs e2e-hw
          if ($lg -notmatch 'Hello from Docker!') { throw "docker logs failed, got: $lg" }
          docker rm e2e-hw >$null
          if ($LASTEXITCODE -ne 0) { throw 'docker rm failed' }

      - name: docker compose plugin check
        run: |
          $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'
          docker compose version

      - name: Double-start guard (must attach/report, not duplicate)
        run: |
          $st = .\dockup.exe daemon status -d Debian
          if ($st -notmatch 'running') { throw "daemon lost between steps, got: $st" }

      - name: dockup shutdown (must leave distro running-state safe + ps stopped)
        run: |
          .\dockup.exe shutdown
          if ($LASTEXITCODE -ne 0) { throw 'shutdown failed' }
          $ps = .\dockup.exe ps
          if ($ps -notmatch 'stopped') { throw "expected stopped ps, got: $ps" }
          .\dockup.exe cleanup
          if ($LASTEXITCODE -ne 0) { throw 'cleanup reported needs-attention' }
          .\dockup.exe doctor

      # Acceptance: revert removes only the delta, images survive re-setup.
      - name: Revert cycle (delta-only removal + re-setup + data intact)
        timeout-minutes: 20
        run: |
          'y' | .\dockup.exe revert Debian
          if ($LASTEXITCODE -ne 0) { throw 'revert failed' }
          $ls = .\dockup.exe list
          if ($ls -notmatch 'no configured distros') { throw "expected empty config, got: $ls" }
          wsl -d Debian -- command -v dockerd
          if ($LASTEXITCODE -eq 0) { throw 'dockerd still present after revert' }
          .\dockup.exe setup Debian
          if ($LASTEXITCODE -ne 0) { throw 're-setup failed' }
          .\dockup.exe daemon start -d Debian
          if ($LASTEXITCODE -ne 0) { throw 'daemon start after re-setup failed' }
          Start-Sleep -Seconds 10
          $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'
          $imgs = docker images --format '{{.Repository}}'
          if ($imgs -notmatch 'hello-world') { throw "hello-world image did not survive revert cycle, got: $imgs" }
          .\dockup.exe shutdown
          if ($LASTEXITCODE -ne 0) { throw 'final shutdown failed' }

      - name: Upload dockup state + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockup-state-logs
          path: |
            ${{ env.APPDATA }}\dockup\state.json
            ${{ env.APPDATA }}\dockup\logs\*.log
            fg.out.log
            fg.err.log
          if-no-files-found: warn

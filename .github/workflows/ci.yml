name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -o dockup.exe ./cmd/dockup
      - name: smoke version
        run: .\dockup.exe version

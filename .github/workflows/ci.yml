name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test ./...
      - run: $env:GOOS='windows'; $env:GOARCH='amd64'; go build -o dockup.exe ./cmd/dockup
        shell: pwsh

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests (no WSL needed)
        run: go test ./...

      - name: Build (windows/amd64 only)
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $sha = git rev-parse --short HEAD
          go build -ldflags "-X main.version=v0.1.0-dev -X main.commit=$sha" -o dockup.exe ./cmd/dockup
          .\dockup.exe version

      - uses: actions/upload-artifact@v4
        with:
          name: dockup-exe
          path: dockup.exe
          if-no-files-found: error

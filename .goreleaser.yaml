version: 2

project_name: dockup

git:
  ignore_tags:
    - "image-latest"

builds:
  - id: dockup
    main: ./cmd/dockup
    binary: dockup
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/CHE3MZ/dockup/internal/config.Version={{ .Tag }}

archives:
  - id: windows
    formats: [binary]
    name_template: "dockup-windows-{{ .Arch }}"

checksum:
  name_template: dockup_checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^(build|chore|ci|docs|style|test)(\(.+\))?:'
      - "^Merge pull request"
      - "^Merge branch"

release:
  github:
    owner: CHE3MZ
    name: dockup
  mode: keep-existing
  prerelease: auto
  header: |
    ## Dockup {{ .Tag }}
  footer: |
    ### Prebuilt WSL image

    `dockup-<arch>.tar.gz` is the rootfs for `wsl --import`, with a `.sha256`
    and a detached `.sig`. Verify the signature with `scripts/image/pubkey.txt`
    before importing.

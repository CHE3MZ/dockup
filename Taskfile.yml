version: '3'

tasks:
  default:
    desc: Run default tasks.
    cmds:
      - task: ops
        ignore_error: true
      - task: build
  ops:
    desc: Run scripts in scripts/ops
    cmds:
      - sh scripts/ops/go-bugcheck.sh
      - sh scripts/ops/go-seccheck.sh
  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...
  test:
    desc: Run go tests via script.
    cmds:
      - powershell -ExecutionPolicy Bypass -File ./scripts/test.ps1
  build:
    desc: Build all packages into dist/.
    cmds:
      - powershell -ExecutionPolicy Bypass -File ./scripts/build.ps1
  smoke:
    desc: End-to-end smoke with the generator CLI.
    cmds:
      - powershell -ExecutionPolicy Bypass -File ./scripts/smoke.ps1
  build-site:
    cmds:
      - cd docs && mkdocs build
  check-links:
    cmds:
      - cmd: lychee .
  cliff:
    desc: Preview release notes for unreleased commits.
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --unreleased --strip all
  release-notes:
    desc: Render the latest tag's release notes into RELEASE_NOTES.md.
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --latest --strip all --output RELEASE_NOTES.md
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
